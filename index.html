<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicone Brush · Motion Film</title>
<meta name="description" content="실리콘 클렌징 브러쉬 모션 영상">
<meta property="og:image" content="poster.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #f7f3ef; overflow: hidden; }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; background: #f7f3ef;
  }
  #sound {
    position: fixed; right: 20px; bottom: 20px;
    padding: 10px 16px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    background: rgba(247,243,239,.6); color: #3a2a2a; border-color: rgba(58,42,42,.35);
    font: 500 12px/1 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: opacity .4s, background .2s;
  }
  #sound:hover { background: rgba(255,255,255,.12); }
  #sound:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  body.idle #sound { opacity: 0; }
</style>
</head>
<body>
<video id="film" src="film.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto"></video>
<button id="sound" type="button" aria-pressed="false">Sound off</button>
<script>
  const v = document.getElementById('film');
  const btn = document.getElementById('sound');

  function render() {
    btn.textContent = v.muted ? 'Sound off' : 'Sound on';
    btn.setAttribute('aria-pressed', String(!v.muted));
  }

  // 소리 켠 채로 자동재생을 먼저 시도하고, 브라우저가 막으면 음소거로 재생
  v.muted = false;
  v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }).finally(render);

  btn.addEventListener('click', () => { v.muted = !v.muted; v.play().catch(() => {}); render(); });

  let t;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(t);
    t = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake, { passive: true }));
  wake();
</script>
</body>
</html>
